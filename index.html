<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Email Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f5f3;
            color: #2f2f2f;
        }

        .container {
            max-width: 900px;
            margin: 48px auto;
            background-color: #ffffff;
            padding: 36px;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background-color: #556b2f;
            color: #ffffff;
            padding: 20px 24px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin: -36px -36px 28px -36px;
        }

        .description {
            margin-bottom: 24px;
            color: #5f5f5f;
            font-size: 15px;
            line-height: 1.6;
        }

        textarea {
            width: 100%;
            height: 170px;
            padding: 14px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #cfd3c9;
            resize: vertical;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #556b2f;
            box-shadow: 0 0 0 3px rgba(85, 107, 47, 0.18);
        }

        button {
            margin-top: 18px;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #556b2f;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }

        button:hover:not(:disabled) {
            background-color: #3f4f22;
            box-shadow: 0 6px 16px rgba(85, 107, 47, 0.35);
        }

        button:disabled {
            background-color: #a7ad9b;
            cursor: not-allowed;
            box-shadow: none;
        }

        #loading {
            margin-top: 10px;
            font-size: 14px;
            color: #6b6b6b;
            font-style: italic;
        }

        .output {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e0e2dc;
        }

        .section {
            margin-bottom: 20px;
        }

        .label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
            color: #3f4f22;
        }

        .value {
            background-color: #f8f9f7;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #e0e2dc;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        Smart Email Assistant
    </div>

    <p class="description">
        Paste a customer email below to automatically summarize it, detect intent and sentiment,
        and generate a professional reply draft.
    </p>

    <textarea id="emailInput" placeholder="Paste customer email here..."></textarea>

    <button id="processBtn" onclick="processEmail()">Process Email</button>
    <p id="loading" style="display:none;">Processing email, please wait...</p>

    <div id="result" class="output" style="display:none;">
        <div class="section">
            <span class="label">Summary</span>
            <div id="summary" class="value"></div>
        </div>

        <div class="section">
            <span class="label">Intent</span>
            <div id="intent" class="value"></div>
        </div>

        <div class="section">
            <span class="label">Sentiment</span>
            <div id="sentiment" class="value"></div>
        </div>

        <div class="section">
            <span class="label">Suggested Reply</span>
            <div id="reply" class="value"></div>
        </div>
    </div>

</div>

<script>
    async function processEmail() {
        document.getElementById("loading").style.display = "block";
        document.getElementById("processBtn").disabled = true;

        const emailText = document.getElementById("emailInput").value;

        if (!emailText.trim()) {
            alert("Please enter an email.");
            document.getElementById("loading").style.display = "none";
            document.getElementById("processBtn").disabled = false;
            return;
        }

        if (emailText.length > 3000) {
            alert("Email too long. Please shorten it.");
            document.getElementById("loading").style.display = "none";
            document.getElementById("processBtn").disabled = false;
            return;
        }

        const response = await fetch("/process-email", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email_text: emailText
            })
        });

        if (!response.ok) {
            document.getElementById("loading").style.display = "none";
            document.getElementById("processBtn").disabled = false;
            alert("Something went wrong. Please try again.");
            return;
        }

        const data = await response.json();

        document.getElementById("summary").innerText = data.summary;
        document.getElementById("intent").innerText = data.intent;
        document.getElementById("sentiment").innerText = data.sentiment;
        document.getElementById("reply").innerText = data.suggested_reply;

        document.getElementById("loading").style.display = "none";
        document.getElementById("processBtn").disabled = false;
        document.getElementById("result").style.display = "block";
    }
</script>

</body>
</html>
